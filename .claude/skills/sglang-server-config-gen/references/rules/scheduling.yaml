schema_version: 1
topic: scheduling
description: 负载相关的调度策略、搜索轴、候选数量和 SLA 目标。
rules:
  - id: scheduling.policy_by_prefix_sharing
    title: 只有共享前缀负载才考虑 lpm
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      AI coding/同 system prompt 等大量共享前缀时才 pin schedule-policy=lpm；随机独立
      请求用默认 fcfs。不要把 lpm 当所有 workload 的固定最优值。
    evidence:
      kind: official
      ref: "SGLang scheduling policy guidance"
      verified_with: "sglang-v0.5.10"
    tags: [scheduling, prefix-sharing]

  - id: scheduling.conservativeness.feedback_loop
    title: schedule-conservativeness 依据运行信号调节
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      默认搜索 [0.3, 1.0, 1.3]：token usage<0.9 且队列有请求时可尝试 0.3；频繁
      “KV cache pool is full. Retract requests”时尝试 1.3。频繁 retract 会伤害 P99，
      但最终是否淘汰仍按 JobSpec SLA 与实测结果决定。
    evidence:
      kind: official
      ref: "SGLang schedule-conservativeness guidance"
      verified_with: "sglang-v0.5.10"
    tags: [scheduling, kv-cache, p99]

  - id: scheduling.candidate_budget.bounded_product
    title: 候选先覆盖高影响轴再补低影响轴
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      基线优先；高影响优先覆盖 TP、投机解码、attention 的独立值和必要交叉；中影响
      再覆盖 mem-fraction/mamba；有余量才加入 chunked-prefill、schedule、KV dtype。
      遵守 max_candidates，去重，不要让某一个轴占满名额。
    evidence:
      kind: judgment
      ref: "baseline_first_bounded_product candidate allocation"
      verified_with: "project-rule-v1"
    tags: [scheduling, search-space, candidates]

  - id: scheduling.goodput_under_sla
    title: 在 SLA 约束内比较 goodput
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      不按裸吞吐选最优。对每条候选找满足 TTFT、TPOT、success_rate 且输出未截断的
      最大并发，再比较 total token throughput；SLA 使用 JobSpec 中的阈值，不要在规则
      里写死某个模型的阈值。
    evidence:
      kind: judgment
      ref: "项目 ranker goodput objective"
      verified_with: "project-rule-v1"
    tags: [scheduling, sla, goodput]


