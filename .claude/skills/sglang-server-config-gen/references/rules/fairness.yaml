schema_version: 1
topic: fairness
description: 保证不同候选之间的比较公平、结果可追溯、坏数据不污染排名。
rules:
  - id: fairness.same_workload_template
    title: 候选之间只改服务端参数
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      所有候选复用同一份 workload、采样参数、prompt 数量和客户端模板；并发搜索只改
      max-concurrency/num-prompts。服务端候选可以改变启动参数，但不能偷偷改变输入输出
      长度或 benchmark 方法。
    evidence:
      kind: measured
      ref: "executor/client template fairness contract"
      verified_with: "project-test-suite"
    tags: [fairness, benchmark]

  - id: fairness.warmup_and_repetition
    title: 预热和重复运行隔离噪声
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      首次运行可能包含 kernel 编译尖峰，应先 warmup 并丢弃；前几名配置最好重复 2-3 次，
      差异小于噪声时不要强行排序。
    evidence:
      kind: judgment
      ref: "benchmark noise control policy"
      verified_with: "project-rule-v1"
    tags: [fairness, warmup, variance]

  - id: fairness.output_health_gate
    title: 输出截断的数据不参与结论
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      使用 --backend sglang 的真实 /generate 路径；若 avg_output_tokens < output_len*0.9，
      或请求被网关/并发限制提前结束，该档数据作废。thinking 模型不要因为 chat completions
      的 content 为空而误判成零 decode 吞吐。
    evidence:
      kind: measured
      ref: "项目 benchmark data health checks"
      verified_with: "project-rule-v1"
    tags: [fairness, metrics, output-health]

  - id: fairness.provenance_and_status
    title: 事实、实测和判断分层保存
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      官方/源码事实不被单次实测覆盖；实测结果带硬件、镜像、模型和 workload；人的判断
      标为 judgment。规则状态用 active/experimental/deprecated 管理，候选 reasons 引用
      rule id，报告记录实际命中的规则和版本。
    evidence:
      kind: judgment
      ref: "modular knowledge provenance policy"
      verified_with: "project-rule-v1"
    tags: [fairness, provenance, maintenance]

