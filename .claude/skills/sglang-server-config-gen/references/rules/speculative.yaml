schema_version: 1
topic: speculative
description: 根据模型权重、镜像版本和工作负载选择投机解码候选，不把 EAGLE 写死。
rules:
  - id: speculative.select_by_model_and_image
    title: 投机算法必须取模型声明与镜像能力的交集
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      先读 models.yaml 的 speculative_options（或兼容读取 capabilities.supports_mtp +
      mtp_params），再读 sglang-images.yaml 的 speculative_algorithms，最终只从两者
      交集生成算法候选；NONE 永远作为对照基线。NGRAM 没有草稿权重，可在镜像支持且
      workload 有重复前缀时作为单独的模型无关例外。不要看到 supports_mtp=true 就自动
      把所有算法都套成 EAGLE，也不要为缺少 draft 权重/路径的算法编造参数。
    evidence:
      kind: source
      ref: "SGLang SpeculativeAlgorithm registry and model cookbook metadata"
      verified_with: "sglang-v0.5.16"
    tags: [speculative, model, image]

  - id: speculative.available_algorithms_by_image
    title: 镜像记录可用算法名，版本差异显式化
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      v0.5.10 的内置算法包括 EAGLE/EAGLE3、STANDALONE、NGRAM、NONE；v0.5.13
      增加 DFLASH、FROZEN_KV_MTP；v0.5.16 还包括 DSPARK。这里的“可用”只表示
      镜像代码认识该名字，不代表任意模型都有对应权重或配置；后者由模型卡和
      speculative_options 决定。自定义注册算法只能在镜像显式声明后进入候选。
    evidence:
      kind: official
      ref: "https://github.com/sgl-project/sglang/blob/v0.5.16/python/sglang/srt/speculative/spec_info.py"
      verified_with: "sglang-v0.5.10/v0.5.13/v0.5.16"
    tags: [speculative, image, version]

  - id: speculative.model_requirements
    title: 不同算法需要不同模型侧材料
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      EAGLE/EAGLE3/FROZEN_KV_MTP 需要模型卡明确 MTP 能力和配套 mtp_params；
      STANDALONE 需要 speculative_draft_model_path 及草稿模型信息；DFLASH/DSPARK
      需要专用 draft checkpoint/参数；NGRAM 不需要草稿权重，但更适合有重复前缀的负载。
      缺材料时保留 NONE，不要靠猜测拼命令；若要探索，标 experimental 并在 reasons
      写明缺失字段。
    evidence:
      kind: source
      ref: "SGLang speculative workers/server arguments"
      verified_with: "sglang-v0.5.16"
    tags: [speculative, draft-model, ngram]

  - id: speculative.eagle_parameters
    title: EAGLE 参数只能从模型卡带出
    status: active
    confidence: high
    applies_when:
      speculative_algorithm: [EAGLE, EAGLE3]
    guidance: |
      speculative-num-steps、speculative-eagle-topk、speculative-num-draft-tokens
      原样取模型卡的 speculative_options/mtp_params；缺失时不要自行发明。当前已知
      topk>1 与部分 overlap/trtllm_mha 路径不兼容，默认固定 topk=1，变化必须标实验。
    evidence:
      kind: official
      ref: "SGLang Qwen cookbook speculative decoding recipe"
      verified_with: "sglang-v0.5.16"
    tags: [speculative, eagle, mtp]

  - id: speculative.cross_constraints
    title: 投机解码与调度/混合架构的冲突要显式记录
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      投机解码与 enable-mixed-chunk 存在源码冲突时不要拼在一起；NGRAM 在支持的版本
      通常不能直接使用 overlap worker；关闭 radix cache 时只使用不依赖 radix 状态的
      mamba 分支。规则用于解释和标记风险，不替代执行器实测，也不把实验候选全部提前删掉。
    evidence:
      kind: source
      ref: "SGLang speculative workers and server argument constraints"
      verified_with: "sglang-v0.5.10 to v0.5.16"
    tags: [speculative, scheduling, mamba]

