schema_version: 1
topic: memory
description: 管理 context、KV cache、显存比例和 hybrid mamba 状态池。
rules:
  - id: memory.context_length.never_infer_from_workload
    title: 不把压测长度写成 context-length
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      压测 input+output 长度不是服务 context 上限；默认不写 --context-length，让模型
      config 的 native context 生效。只有用户明确给出生产 context cap 时才写那个精确值。
      需要记录实际回落的 context 和 max_total_num_tokens，但不把它们误当成生成参数。
    evidence:
      kind: source
      ref: "SGLang KV cache pool/context_length semantics"
      verified_with: "sglang-v0.5.13"
    tags: [context, kv-cache, startup]

  - id: memory.kv_headroom.sort_only
    title: KV 余量估算只排序不删 TP
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      可用 kv_headroom_gb=max(8, input_len*target_concurrency*kv_gb_per_token/tp) 做
      抗并发排序提示；模型卡优先提供 kv_gb_per_token，否则用 0.00012 作为稠密模型
      粗略兜底。它不是启动准入条件，真值看启动日志和实测。
    evidence:
      kind: judgment
      ref: "候选排序设计，避免用粗估计误删可运行 TP"
      verified_with: "project-rule-v1"
    tags: [kv-cache, tp, ranking]

  - id: memory.search_axes.default_pool
    title: 显存相关搜索轴使用有限默认档
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      默认 mem-fraction-static=[0.80,0.84,0.88,0.92]；chunked-prefill-size=[4096,8192,16384]；
      max-running-requests=[8,16,32]（长输入才重点使用）；kv-cache-dtype=[auto,fp8_e4m3]。
      显式 JobSpec 可以覆盖默认档；不要为每个轴做无边界笛卡尔积。
    evidence:
      kind: judgment
      ref: "项目搜索空间默认档"
      verified_with: "project-rule-v1"
    tags: [memory, search-space]

  - id: memory.hybrid_mamba.strategy_and_ratio
    title: hybrid mamba 的状态池单独处理
    status: active
    confidence: medium
    applies_when:
      model_hybrid_mamba: true
    guidance: |
      no_buffer 与 extra_buffer 不是普通独立轴：no_buffer+radix cache 通常 page_size=1，
      extra_buffer 通常配 page_size=64，关闭 radix cache 时不要使用依赖 radix 状态的
      extra_buffer。mamba-full-memory-ratio 先按输入长度和目标并发估算，再对少数档位
      实测；短输入不要照搬长上下文的极端比例。
    evidence:
      kind: source
      ref: "SGLang hybrid mamba cache strategy constraints and cookbook"
      verified_with: "sglang-v0.5.10"
    tags: [mamba, gdn, memory, page-size]

  - id: memory.startup_log.capacity_fields
    title: 用启动日志校准显存容量判断
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      服务启动后记录 available_gpu_mem、max_total_num_tokens、max_num_reqs 以及实际
      context。available_gpu_mem 过大说明 mem fraction 可能保守；混合架构若 max_num_reqs
      远小于 KV 推算，优先检查 mamba state pool，而不是继续加显存比例。
    evidence:
      kind: official
      ref: "SGLang startup log fields"
      verified_with: "sglang-v0.5.10"
    tags: [memory, observability, startup]


