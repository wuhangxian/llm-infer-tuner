schema_version: 1
topic: attention
description: 按 GPU 算力、SGLang 镜像和 prefill/decode 阶段选择 attention 后端。
rules:
  - id: attention.backend_by_sm
    title: attention 后端先按 SM 短名单再与镜像能力取交集
    status: active
    confidence: high
    applies_when:
      engine: sglang
    guidance: |
      最终候选等于 gpu 的 sm_major 短名单 ∩ catalogs/sglang-images.yaml 的
      attention_backends ∩ 镜像 CUDA 能力。SM7 只用 triton；SM8 用 flashinfer/triton；
      SM9 可用 fa3/flashinfer/triton（fa3 需要 CUDA >= 12.3）；SM10 可用
      trtllm_mha/flashinfer/triton（trtllm_mha 需要 CUDA >= 12.8）；SM12(Pro5000)
      默认只列 flashinfer/triton。prefill 和 decode 两侧分别检查，不能只看一个阶段。
    evidence:
      kind: source
      ref: "SGLang attention registry/server_args.py"
      verified_with: "sglang-v0.5.10 to v0.5.16"
    tags: [attention, gpu, image]

  - id: attention.sm120.prefill_trtllm_mha_forbidden
    title: SM120 禁止 prefill trtllm_mha
    status: active
    confidence: high
    applies_when:
      gpu_sm_major: [12]
    guidance: |
      SM120(Pro5000) 上 prefill=trtllm_mha 会在启动阶段失败，永远不要生成。
      decode=trtllm_mha 的门与 prefill 不同，当前只作为待实测的实验方向，不要因为
      “SM120 能通过 decode 门”就把它当默认候选。fa3 在 SM120 也排除。
    evidence:
      kind: source
      ref: "server_args.py 的 prefill trtllm_mha gate 和 attention registry"
      verified_with: "sglang-v0.5.10"
    tags: [attention, sm120, startup]

  - id: attention.page_size_by_backend
    title: page_size 随后端和混合架构策略联动
    status: active
    confidence: medium
    applies_when:
      engine: sglang
    guidance: |
      page_size 不是独立笛卡尔轴：flashinfer/triton 默认只测 1；mamba no_buffer
      配 radix cache 时用 1；extra_buffer 通常用 64；trtllm_mha 才考虑 16/32/64。
      换 SGLang 版本时重新核对 server_args.py 的 page-size 约束；不要依赖服务静默
      改写后的值来比较候选。
    evidence:
      kind: source
      ref: "SGLang server_args.py page-size handling and cookbook recipes"
      verified_with: "sglang-v0.5.10"
    tags: [attention, memory, page-size]

