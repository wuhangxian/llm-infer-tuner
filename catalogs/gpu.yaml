# ---- 缺显卡型号时怎么补 ----
# 在 gpu_catalog 下加一条(只记算力事实,不记显存/卡数 —— 那两个在 job.json 里写):
#   compute_cap / sm_major:  查官方 https://developer.nvidia.com/cuda-gpus 或实测:
#     nvidia-smi --query-gpu=compute_cap --format=csv   → compute_capability
#   nvlink:                   nvidia-smi topo -m → 有 NV# 链路=true,只见 PIX/PHB=false
#   source:                   official=官方表 / measured=实测 / reference=按同架构推(最可疑)
