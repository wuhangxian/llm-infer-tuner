# ============ GPU 目录(引擎无关的物理事实)============
#
# 只剩一层:gpu_catalog。key = JobSpec.gpu_model(显卡型号)。
#
# 为什么只有一层:
#   旧设计有 instances(机型级)+ gpu_catalog(显卡级)两层,但 instances 的字段
#   (count / memory_gb)现在直接写在 job.json 里(gpu_count / gpu_memory_gb),
#   因为它们是调优决策输入(TP 准入判据),不是被引用的静态事实。
#   host_memory_gb 不影响调优决策,不放了。
#
# 这份是引擎中性的:同一张卡换 vllm 也照用这些物理数;
# 「sm120 该铺哪些 attention 后端」是 sglang 特有知识,不在这里,在
# .claude/skills/sglang-server-config-gen/knowledge.md。
#
# 加新显卡型号 = 在 gpu_catalog 下加一条,不改任何代码。
#
# 每张卡字段:
#   compute_cap  完整算力,如 "8.6"(查官方 https://developer.nvidia.com/cuda-gpus)
#   sm_major    compute_cap 取整,如 8(attention 分桶键)
#   nvlink       有无 NVLink(只影响 TP 排序提示,不排除任何 TP)
#   source       算力可信度:official=官方表 / measured=实测 / reference=按同架构推(最可疑)
#
# key 按显卡名小写匹配(精确优先,再取最长命中)。sm_major 相同的算力共用一档:
#   7.0/7.5→7、8.x/8.9→8、9.0→9、10.x→10、12.0→12。
#
# ⚠️ 这里只放「引擎中性的物理算力」。「某 sm_major 铺哪些 attention 后端」是 sglang 特有知识,
#    不在这份,在 .claude/skills/sglang-server-config-gen/knowledge.md §1 的按算力查后端表。
#
# ⚠️ 单卡显存不写在这里(同型号有不同 SKU,如 A100 40GB/80GB)。显存直接写在
#    job.json 的 gpu_memory_gb 里,是 TP 准入判据(weight_gb/tp ≤ gpu_memory_gb)的输入。

version: 1
updated: 2026-08-12

gpu_catalog:

  # ========== Volta / Turing (SM7x) — 云端老推理卡 ==========
  v100:
    aliases: [tesla v100, v100-sxm2, v100-pcie, v100s]
    compute_cap: "7.0"    # Volta SM70
    sm_major: 7
    nvlink: true          # SXM2 版有 NVLink;PCIe 版无
    source: official
  t4:
    aliases: [tesla t4]
    compute_cap: "7.5"    # Turing SM75 → 落 7 桶
    sm_major: 7
    nvlink: false
    source: official

  # ========== Ampere (SM80 / SM86) ==========
  a100:
    aliases: [a100-80gb, a100 80gb, a100-40gb, a100-sxm, a100-pcie]
    compute_cap: "8.0"    # Ampere GA100
    sm_major: 8
    nvlink: true
    source: official
  a800:
    aliases: [a800-80gb, a800 80gb, a800-40gb, a800-sxm, a800-pcie]
    compute_cap: "8.0"    # SXM/80GB=GA100=8.0;PCIe/40GB=GA102=8.6。取更低 8.0(worst-case);sm_major 都是 8
    sm_major: 8
    nvlink: true
    source: reference     # ★出口特供,不在官方表;按同 die 推,待实测确认
  a10g:
    aliases: [a10-g]
    compute_cap: "8.6"    # AWS g5 专用(GA102)
    sm_major: 8
    nvlink: false
    source: reference     # ★AWS 特供,不在官方表;按 GA102 推,待实测确认
  a30:
    compute_cap: "8.0"    # Ampere GA100
    sm_major: 8
    nvlink: true          # 支持 NVLink Bridge
    source: official
  a40:
    compute_cap: "8.6"    # Ampere GA102
    sm_major: 8
    nvlink: false
    source: official
  a10:
    compute_cap: "8.6"    # Ampere GA102
    sm_major: 8
    nvlink: false
    source: official
  a16:
    compute_cap: "8.6"    # Ampere GA107 ×4
    sm_major: 8
    nvlink: false
    source: official
  a6000:
    aliases: [rtx a6000, rtxa6000]
    compute_cap: "8.6"    # Ampere 工作站 GA102
    sm_major: 8
    nvlink: false         # 有 NVLink Bridge 选件,默认按无
    source: official

  # ========== Ada Lovelace (SM89,均落 8 桶) ==========
  l4:
    compute_cap: "8.9"    # Ada AD104
    sm_major: 8
    nvlink: false
    source: official
  l40:
    compute_cap: "8.9"    # Ada AD102
    sm_major: 8
    nvlink: false
    source: official
  l40s:
    compute_cap: "8.9"    # Ada AD102
    sm_major: 8
    nvlink: false
    source: official
  rtx6000ada:
    aliases: [rtx 6000 ada, rtx6000-ada, "6000 ada"]
    compute_cap: "8.9"    # Ada 工作站 AD102
    sm_major: 8
    nvlink: false         # Ada 代取消 NVLink
    source: official
  "4090":
    aliases: [rtx4090, rtx 4090, geforce rtx 4090]
    compute_cap: "8.9"    # Ada AD102
    sm_major: 8
    nvlink: false
    source: official

  # ========== Hopper (SM90) ==========
  h100:
    compute_cap: "9.0"    # Hopper GH100
    sm_major: 9
    nvlink: true
    source: official
  h200:
    compute_cap: "9.0"    # Hopper GH100(显存升级,算力同 H100)
    sm_major: 9
    nvlink: true
    source: official
  h20:
    compute_cap: "9.0"    # Hopper 中国特供
    sm_major: 9
    nvlink: true
    source: measured      # 实测 compute_cap=9.0(不在官方表)
  h800:
    compute_cap: "9.0"    # Hopper 中国特供,同 GH100 die
    sm_major: 9
    nvlink: true          # 有 NVLink(带宽较 H100 阉割,不影响 compute_cap/backend)
    source: reference     # ★出口特供,不在官方表;按同 die 推,待实测确认
  gh200:
    aliases: [gh200, grace hopper]
    compute_cap: "9.0"    # Hopper GH100(Grace 超级芯片)
    sm_major: 9
    nvlink: true          # Grace-Hopper NVLink-C2C
    source: official

  # ========== Blackwell 数据中心 (SM10x) ==========
  b200:
    compute_cap: "10.0"   # Blackwell 数据中心 SM100 GB100
    sm_major: 10
    nvlink: true
    source: official
  b300:
    compute_cap: "10.3"   # ★一说 SM103(10.3),未实测;sm_major 无论 10.0/10.3 都是 10
    sm_major: 10
    nvlink: true
    source: reference     # ★不在官方表;算力待实测确认(10.0 还是 10.3)
  gb200:
    aliases: [gb200, grace blackwell]
    compute_cap: "10.0"   # Blackwell SM100(Grace 超级芯片)
    sm_major: 10
    nvlink: true          # Grace-Blackwell NVLink
    source: official

  # ========== Blackwell 工作站/消费 (SM120) ==========
  # ⚠️ 这一代是 SM120 ≠ SM100。大量 sglang Blackwell 优化 gate 写在 is_sm100_supported(),
  #    SM120 静默不生效 —— 照抄 B200 配方会起不来。trtllm_mha 在 SM120 的分侧结论见 knowledge.md §1。
  pro5000:
    aliases: [rtx pro 5000, rtx5000, pro 5000]
    compute_cap: "12.0"   # Blackwell SM120
    sm_major: 12
    nvlink: false
    source: measured      # 实测 nvidia-smi compute_cap=12.0
  pro6000:
    aliases: [rtx pro 6000, rtx6000, pro 6000]
    compute_cap: "12.0"   # Blackwell SM120
    sm_major: 12
    nvlink: false
    source: reference     # ★按 RTX PRO Blackwell 系归 SM120,待实测确认
  "5090":
    aliases: [rtx5090, rtx 5090, geforce rtx 5090]
    compute_cap: "12.0"   # Blackwell 消费级 GB202
    sm_major: 12
    nvlink: false
    source: official
  "5080":
    aliases: [rtx5080, rtx 5080, geforce rtx 5080]
    compute_cap: "12.0"   # Blackwell 消费级 GB203
    sm_major: 12
    nvlink: false
    source: official
  "5070ti":
    aliases: [rtx5070ti, rtx 5070 ti, "5070 ti", geforce rtx 5070 ti]
    compute_cap: "12.0"   # Blackwell 消费级 GB203
    sm_major: 12
    nvlink: false
    source: official
  "5070":
    aliases: [rtx5070, rtx 5070, geforce rtx 5070]
    compute_cap: "12.0"   # Blackwell 消费级 GB205
    sm_major: 12
    nvlink: false
    source: official
  "5060":
    aliases: [rtx5060, rtx 5060, geforce rtx 5060, "5060 ti", 5060ti]
    compute_cap: "12.0"   # Blackwell 消费级 GB206
    sm_major: 12
    nvlink: false
    source: official

# ---- 缺显卡型号时怎么补 ----
# 在 gpu_catalog 下加一条(只记算力事实,不记显存/卡数 —— 那两个在 job.json 里写):
#   compute_cap / sm_major:  查官方 https://developer.nvidia.com/cuda-gpus 或实测:
#     nvidia-smi --query-gpu=compute_cap --format=csv   → compute_capability
#   nvlink:                   nvidia-smi topo -m → 有 NV# 链路=true,只见 PIX/PHB=false
#   source:                   official=官方表 / measured=实测 / reference=按同架构推(最可疑)
